# ==============================================================================
# AfriMarkets — pyproject.toml
# PEP 517 / PEP 518 build configuration
# ==============================================================================

[build-system]
requires      = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"


# ==============================================================================
# Project metadata  (PEP 621)
# ==============================================================================

[project]
name            = "afrimarkets"
version         = "0.1.0"
description     = "Unified access to historical and real-time data from African stock exchanges"
readme          = "README.md"
requires-python = ">=3.9"

# FIX 1 : license déclarée comme string SPDX (remplace { file = "LICENSE" }
#          qui génère le warning "TOML table is deprecated")
license = "MIT"

# FIX 2 : license-files pointe explicitement vers le fichier LICENSE
#          (bonne pratique recommandée par setuptools >= 77)
license-files = ["LICENSE"]

authors = [
    { name = "Olabiyi Aurel Géoffroy Odjo",  email = "odjoaurel@gmail.com"            },
    { name = "Koffi Frederic Sessie",          email = "koffisessie@gmail.com"          },
    { name = "Abdoul Oudouss Diakité",         email = "abdouloudoussdiakite@gmail.com" },
    { name = "Steven P. Sanderson II, MPH",    email = "spsanderson@gmail.com"          },
]

maintainers = [
    { name = "Olabiyi Aurel Géoffroy Odjo", email = "odjoaurel@gmail.com" },
]

keywords = [
    "africa",
    "stock market",
    "finance",
    "BRVM",
    "NGX",
    "JSE",
    "GSE",
    "financial data",
    "OHLCV",
    "trading",
    "portfolio",
    "time series",
]

# FIX 3 : classifier "License :: OSI Approved :: MIT License" retiré
#          (déprécié depuis setuptools >= 77 — la licence est portée
#           par license = "MIT" ci-dessus)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

# ------------------------------------------------------------------------------
# Runtime dependencies
# ------------------------------------------------------------------------------
dependencies = [
    # Data wrangling
    "pandas>=1.5.0",
    "numpy>=1.23.0",

    # HTTP & scraping
    "requests>=2.28.0",
    "httpx>=0.24.0",
    "beautifulsoup4>=4.11.0",
    "lxml>=4.9.0",

    # Visualization
    "plotly>=5.13.0",
    "dash>=2.9.0",
    "dash-bootstrap-components>=1.4.0",

    # Statistics
    "scipy>=1.10.0",
    "statsmodels>=0.13.0",

    # Portfolio
    "cvxpy>=1.3.0",
    "PyPortfolioOpt>=1.5.0",

    # ML & forecasting
    "scikit-learn>=1.2.0",
    "xgboost>=1.7.0",
    "prophet>=1.1.0",

    # Utilities
    "python-dateutil>=2.8.0",
    "pytz>=2023.3",
    "tqdm>=4.65.0",
]


# ------------------------------------------------------------------------------
# Optional dependency groups
# ------------------------------------------------------------------------------
[project.optional-dependencies]

tensorflow = ["tensorflow>=2.12.0"]
torch      = ["torch>=2.0.0"]

dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "flake8-bugbear>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.4.0",
    "pre-commit>=3.3.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

ci = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]


# ------------------------------------------------------------------------------
# URLs
# ------------------------------------------------------------------------------
[project.urls]
Homepage      = "https://github.com/XGEOSOFT-CORPORATION/AfriMarkets-python"
Documentation = "https://github.com/XGEOSOFT-CORPORATION/AfriMarkets-python#readme"
Repository    = "https://github.com/XGEOSOFT-CORPORATION/AfriMarkets-python"
"Bug Tracker" = "https://github.com/XGEOSOFT-CORPORATION/AfriMarkets-python/issues"
Changelog     = "https://github.com/XGEOSOFT-CORPORATION/AfriMarkets-python/releases"


# ==============================================================================
# Tool configurations
# ==============================================================================

[tool.black]
line-length    = 88
target-version = ["py39", "py310", "py311", "py312"]
include        = '\.pyi?$'
exclude        = '''
/(
    \.git
  | \.venv
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile                    = "black"
line_length                = 88
known_first_party          = ["afrimarkets"]
known_third_party          = ["pandas", "numpy", "plotly", "dash", "requests"]
force_sort_within_sections = true

[tool.mypy]
python_version         = "3.9"
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true
strict                 = false

[[tool.mypy.overrides]]
module = [
    "plotly.*",
    "dash.*",
    "prophet.*",
    "cvxpy.*",
    "pypfopt.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
addopts          = "-v --tb=short --cov=afrimarkets --cov-report=term-missing"
filterwarnings   = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["afrimarkets"]
omit   = [
    "*/tests/*",
    "*/examples/*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.setuptools.packages.find]
where   = ["."]
include = ["afrimarkets*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
afrimarkets = ["datasets/*.csv", "datasets/*.json", "py.typed"]